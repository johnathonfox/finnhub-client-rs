[package]
name = "finnhub-client-rs"
version = "0.1.0"
edition = "2021"
description = "Async Rust client for the Finnhub.io financial data API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johnathonfox/finnhub-client-rs"
homepage = "https://github.com/johnathonfox/finnhub-client-rs"
documentation = "https://docs.rs/finnhub-client-rs"
readme = "README.md"
keywords = ["finnhub", "finance", "stocks", "api", "market-data"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
governor = "0.10"
secrecy = "0.10"

[dev-dependencies]
dotenvy = "0.15"
wiremock = "0.6"
